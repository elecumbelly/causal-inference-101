<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
<title id="title">The causal workflow</title><desc id="desc">Design decisions precede estimation; diagnostics challenge rather than prove assumptions.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#0b2038"/></marker><filter id="shadow"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#0b2038" flood-opacity=".14"/></filter></defs>
<rect width="100%" height="100%" rx="28" fill="#fbf8f1"/>
<text x="48" y="55" font-family="Inter,Arial,sans-serif" font-size="28" font-weight="700" fill="#0b2038">The causal workflow</text>
<text x="48" y="84" font-family="Inter,Arial,sans-serif" font-size="15" fill="#66788a">Design decisions precede estimation; diagnostics challenge rather than prove assumptions.</text>
<rect x="35" y="190" width="130" height="72" rx="16" fill="#e8f5f3" stroke="#168c8c" stroke-width="2" filter="url(#shadow)"/><text x="100.0" y="232.0" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="600" fill="#0b2038">Question</text><line x1="165" y1="226" x2="187" y2="226" stroke="#0b2038" stroke-width="3" marker-end="url(#arrow)"/><rect x="187" y="190" width="130" height="72" rx="16" fill="#ffffff" stroke="#168c8c" stroke-width="2" filter="url(#shadow)"/><text x="252.0" y="232.0" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="600" fill="#0b2038">Estimand</text><line x1="317" y1="226" x2="339" y2="226" stroke="#0b2038" stroke-width="3" marker-end="url(#arrow)"/><rect x="339" y="190" width="130" height="72" rx="16" fill="#ffffff" stroke="#168c8c" stroke-width="2" filter="url(#shadow)"/><text x="404.0" y="232.0" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="600" fill="#0b2038">Identification</text><line x1="469" y1="226" x2="491" y2="226" stroke="#0b2038" stroke-width="3" marker-end="url(#arrow)"/><rect x="491" y="190" width="130" height="72" rx="16" fill="#e8f5f3" stroke="#168c8c" stroke-width="2" filter="url(#shadow)"/><text x="556.0" y="232.0" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="600" fill="#0b2038">Estimation</text><line x1="621" y1="226" x2="643" y2="226" stroke="#0b2038" stroke-width="3" marker-end="url(#arrow)"/><rect x="643" y="190" width="130" height="72" rx="16" fill="#ffffff" stroke="#e76f51" stroke-width="2" filter="url(#shadow)"/><text x="708.0" y="232.0" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="600" fill="#0b2038">Diagnostics</text><line x1="773" y1="226" x2="795" y2="226" stroke="#0b2038" stroke-width="3" marker-end="url(#arrow)"/><rect x="795" y="190" width="130" height="72" rx="16" fill="#ffffff" stroke="#e76f51" stroke-width="2" filter="url(#shadow)"/><text x="860.0" y="232.0" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="600" fill="#0b2038">Interpretation</text><text x="480" y="335" text-anchor="middle" font-family="Inter,Arial" font-size="19" font-weight="700" fill="#0b2038">No estimator can repair an unidentified question.</text><text x="480" y="375" text-anchor="middle" font-family="Inter,Arial" font-size="17" fill="#66788a">Report the target, assumptions, evidence, uncertainty and limits together.</text></svg>