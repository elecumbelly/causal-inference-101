<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
<title id="title">Three paths, three conditioning rules</title><desc id="desc">Chains and forks transmit association; colliders block it until conditioned on.</desc>
