<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
<title id="title">Treatment-confounder feedback</title><desc id="desc">A time-varying covariate can be both an effect of earlier treatment and a cause of later treatment.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#0b2038"/></marker><filter id="shadow"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#0b2038" flood-opacity=".14"/></filter></defs>
<rect width="100%" height="100%" rx="28" fill="#fbf8f1"/>
<text x="48" y="55" font-family="Inter,Arial,sans-serif" font-size="28" font-weight="700" fill="#0b2038">Treatment-confounder feedback</text>
<text x="48" y="84" font-family="Inter,Arial,sans-serif" font-size="15" fill="#66788a">A time-varying covariate can be both an effect of earlier treatment and a cause of later treatment.</text>
<rect x="55" y="150" width="150" height="68" rx="16" fill="#ffffff" stroke="#168c8c" stroke-width="2" filter="url(#shadow)"/><text x="130.0" y="190.0" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="600" fill="#0b2038">A₁</text><rect x="290" y="150" width="150" height="68" rx="16" fill="#fff7df" stroke="#d6a84b" stroke-width="2" filter="url(#shadow)"/><text x="365.0" y="190.0" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="600" fill="#0b2038">L₂</text><rect x="525" y="150" width="150" height="68" rx="16" fill="#ffffff" stroke="#168c8c" stroke-width="2" filter="url(#shadow)"/><text x="600.0" y="190.0" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="600" fill="#0b2038">A₂</text><rect x="760" y="150" width="150" height="68" rx="16" fill="#fff0eb" stroke="#e76f51" stroke-width="2" filter="url(#shadow)"/><text x="835.0" y="190.0" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="600" fill="#0b2038">Y</text><line x1="205" y1="184" x2="290" y2="184" stroke="#0b2038" stroke-width="3" marker-end="url(#arrow)"/><line x1="440" y1="184" x2="525" y2="184" stroke="#0b2038" stroke-width="3" marker-end="url(#arrow)"/><line x1="675" y1="184" x2="760" y2="184" stroke="#0b2038" stroke-width="3" marker-end="url(#arrow)"/><line x1="205" y1="205" x2="760" y2="205" stroke="#168c8c" stroke-width="3" marker-end="url(#arrow)"/><line x1="440" y1="205" x2="760" y2="205" stroke="#168c8c" stroke-width="3" marker-end="url(#arrow)"/><text x="365" y="290" text-anchor="middle" font-family="Inter,Arial" font-size="17" fill="#66788a">L₂ is post-treatment for A₁</text><text x="600" y="320" text-anchor="middle" font-family="Inter,Arial" font-size="17" fill="#66788a">and a confounder for A₂ → Y</text><text x="480" y="405" text-anchor="middle" font-family="Inter,Arial" font-size="20" font-weight="700" fill="#e76f51">Standard adjustment creates a dilemma; g-methods resolve it.</text></svg>