<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
<title id="title">The missing counterfactual</title><desc id="desc">Each unit has two potential outcomes, but treatment reveals only one.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#0b2038"/></marker><filter id="shadow"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#0b2038" flood-opacity=".14"/></filter></defs>
<rect width="100%" height="100%" rx="28" fill="#fbf8f1"/>
<text x="48" y="55" font-family="Inter,Arial,sans-serif" font-size="28" font-weight="700" fill="#0b2038">The missing counterfactual</text>
<text x="48" y="84" font-family="Inter,Arial,sans-serif" font-size="15" fill="#66788a">Each unit has two potential outcomes, but treatment reveals only one.</text>
<rect x="70" y="155" width="210" height="86" rx="16" fill="#fff" stroke="#168c8c" stroke-width="2" filter="url(#shadow)"/><text x="175.0" y="204.0" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="600" fill="#0b2038">Unit i</text><line x1="280" y1="198" x2="390" y2="155" stroke="#0b2038" stroke-width="3" marker-end="url(#arrow)"/><line x1="280" y1="198" x2="390" y2="310" stroke="#0b2038" stroke-width="3" marker-end="url(#arrow)"/><rect x="395" y="115" width="230" height="82" rx="16" fill="#e8f5f3" stroke="#168c8c" stroke-width="2" filter="url(#shadow)"/><text x="510.0" y="162.0" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="600" fill="#0b2038">Yᵢ(1): treated</text><rect x="395" y="270" width="230" height="82" rx="16" fill="#fff0eb" stroke="#e76f51" stroke-width="2" filter="url(#shadow)"/><text x="510.0" y="317.0" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="600" fill="#0b2038">Yᵢ(0): control</text><rect x="700" y="115" width="190" height="82" rx="16" fill="#e8f5f3" stroke="#168c8c" stroke-width="2" filter="url(#shadow)"/><text x="795.0" y="162.0" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="600" fill="#0b2038">Observed</text><rect x="700" y="270" width="190" height="82" rx="16" fill="#f4f1eb" stroke="#66788a" stroke-width="2" filter="url(#shadow)"/><text x="795.0" y="317.0" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="600" fill="#0b2038">Missing</text><line x1="625" y1="156" x2="700" y2="156" stroke="#168c8c" stroke-width="3" marker-end="url(#arrow)"/><line x1="625" y1="311" x2="700" y2="311" stroke="#66788a" stroke-width="3" marker-end="url(#arrow)" stroke-dasharray="8 7"/><text x="480" y="425" font-family="Inter,Arial" font-size="20" font-weight="700" fill="#0b2038">τᵢ = Yᵢ(1) − Yᵢ(0)</text><text x="480" y="455" font-family="Inter,Arial" font-size="15" fill="#66788a">Individual effects require a comparison we can never directly observe.</text></svg>