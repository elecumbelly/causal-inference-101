<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
<title id="title">Transporting an effect</title><desc id="desc">Generalization requires an explicit account of what changes between source and target populations.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#0b2038"/></marker><filter id="shadow"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#0b2038" flood-opacity=".14"/></filter></defs>
<rect width="100%" height="100%" rx="28" fill="#fbf8f1"/>
<text x="48" y="55" font-family="Inter,Arial,sans-serif" font-size="28" font-weight="700" fill="#0b2038">Transporting an effect</text>
<text x="48" y="84" font-family="Inter,Arial,sans-serif" font-size="15" fill="#66788a">Generalization requires an explicit account of what changes between source and target populations.</text>
<rect x="70" y="205" width="230" height="100" rx="16" fill="#e8f5f3" stroke="#168c8c" stroke-width="2" filter="url(#shadow)"/><text x="185.0" y="261.0" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="600" fill="#0b2038">Source trial S=1</text><rect x="660" y="205" width="230" height="100" rx="16" fill="#fff0eb" stroke="#e76f51" stroke-width="2" filter="url(#shadow)"/><text x="775.0" y="261.0" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="600" fill="#0b2038">Target S=0</text><line x1="300" y1="255" x2="660" y2="255" stroke="#d6a84b" stroke-width="3" marker-end="url(#arrow)" stroke-dasharray="10 7"/><rect x="365" y="130" width="230" height="70" rx="16" fill="#fff7df" stroke="#d6a84b" stroke-width="2" filter="url(#shadow)"/><text x="480.0" y="171.0" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="600" fill="#0b2038">Effect modifiers X</text><rect x="365" y="330" width="230" height="70" rx="16" fill="#fff" stroke="#168c8c" stroke-width="2" filter="url(#shadow)"/><text x="480.0" y="371.0" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="600" fill="#0b2038">Invariant mechanism</text><text x="480" y="285" text-anchor="middle" font-family="Inter,Arial" font-size="18" font-weight="700" fill="#0b2038">reweight X and defend invariance</text></svg>