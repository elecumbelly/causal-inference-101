<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
<title id="title">Instrumental variables identify through encouragement</title><desc id="desc">Relevance is visible in data; independence and exclusion require a design argument.</desc>
