<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
<title id="title">Mediation effects</title><desc id="desc">Natural effects compare nested counterfactuals and require stronger assumptions than the total effect.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#0b2038"/></marker><filter id="shadow"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#0b2038" flood-opacity=".14"/></filter></defs>
<rect width="100%" height="100%" rx="28" fill="#fbf8f1"/>
<text x="48" y="55" font-family="Inter,Arial,sans-serif" font-size="28" font-weight="700" fill="#0b2038">Mediation effects</text>
<text x="48" y="84" font-family="Inter,Arial,sans-serif" font-size="15" fill="#66788a">Natural effects compare nested counterfactuals and require stronger assumptions than the total effect.</text>
<rect x="85" y="280" width="180" height="76" rx="16" fill="#fff7df" stroke="#d6a84b" stroke-width="2" filter="url(#shadow)"/><text x="175.0" y="324.0" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="600" fill="#0b2038">Treatment A</text><rect x="390" y="130" width="180" height="76" rx="16" fill="#e8f5f3" stroke="#168c8c" stroke-width="2" filter="url(#shadow)"/><text x="480.0" y="174.0" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="600" fill="#0b2038">Mediator M</text><rect x="695" y="280" width="180" height="76" rx="16" fill="#fff0eb" stroke="#e76f51" stroke-width="2" filter="url(#shadow)"/><text x="785.0" y="324.0" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="600" fill="#0b2038">Outcome Y</text><line x1="265" y1="300" x2="410" y2="205" stroke="#0b2038" stroke-width="3" marker-end="url(#arrow)"/><line x1="570" y1="168" x2="750" y2="280" stroke="#0b2038" stroke-width="3" marker-end="url(#arrow)"/><line x1="265" y1="318" x2="695" y2="318" stroke="#0b2038" stroke-width="3" marker-end="url(#arrow)"/><text x="480" y="365" text-anchor="middle" font-family="Inter,Arial" font-size="17" font-weight="700" fill="#0b2038">Natural direct effect: change A while holding M at M(0)</text><text x="480" y="405" text-anchor="middle" font-family="Inter,Arial" font-size="17" font-weight="700" fill="#168c8c">Natural indirect effect: change M(0) → M(1) while holding A = 1</text></svg>