<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
<title id="title">Assignment, receipt, and analysis</title><desc id="desc">Random assignment identifies the effect of assignment; noncompliance separates it from treatment received.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#0b2038"/></marker><filter id="shadow"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#0b2038" flood-opacity=".14"/></filter></defs>
<rect width="100%" height="100%" rx="28" fill="#fbf8f1"/>
<text x="48" y="55" font-family="Inter,Arial,sans-serif" font-size="28" font-weight="700" fill="#0b2038">Assignment, receipt, and analysis</text>
<text x="48" y="84" font-family="Inter,Arial,sans-serif" font-size="15" fill="#66788a">Random assignment identifies the effect of assignment; noncompliance separates it from treatment received.</text>
<rect x="50" y="210" width="150" height="72" rx="16" fill="#ffffff" stroke="#168c8c" stroke-width="2" filter="url(#shadow)"/><text x="125.0" y="252.0" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="600" fill="#0b2038">Eligible</text><line x1="200" y1="246" x2="300" y2="246" stroke="#0b2038" stroke-width="3" marker-end="url(#arrow)"/><rect x="305" y="200" width="180" height="92" rx="16" fill="#fff7df" stroke="#d6a84b" stroke-width="2" filter="url(#shadow)"/><text x="395.0" y="252.0" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="600" fill="#0b2038">Randomize</text><line x1="485" y1="235" x2="590" y2="155" stroke="#0b2038" stroke-width="3" marker-end="url(#arrow)"/><line x1="485" y1="255" x2="590" y2="350" stroke="#0b2038" stroke-width="3" marker-end="url(#arrow)"/><rect x="595" y="115" width="190" height="80" rx="16" fill="#e8f5f3" stroke="#168c8c" stroke-width="2" filter="url(#shadow)"/><text x="690.0" y="161.0" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="600" fill="#0b2038">Assigned A</text><rect x="595" y="310" width="190" height="80" rx="16" fill="#fff0eb" stroke="#e76f51" stroke-width="2" filter="url(#shadow)"/><text x="690.0" y="356.0" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="600" fill="#0b2038">Assigned B</text><line x1="785" y1="155" x2="880" y2="155" stroke="#0b2038" stroke-width="3" marker-end="url(#arrow)"/><line x1="785" y1="350" x2="880" y2="350" stroke="#0b2038" stroke-width="3" marker-end="url(#arrow)"/><text x="870" y="135" text-anchor="end" font-family="Inter,Arial" font-size="15" fill="#66788a">may not receive A</text><text x="870" y="330" text-anchor="end" font-family="Inter,Arial" font-size="15" fill="#66788a">may access A</text><text x="480" y="455" text-anchor="middle" font-family="Inter,Arial" font-size="20" font-weight="700" fill="#0b2038">ITT compares groups as assigned</text></svg>